<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="description" content="Volunteer registration application form" />
  <meta name="author" content="Jasryan Singh" />
  <title>Volunteer Registration</title>
  <link rel="stylesheet" href="styles/a1Style.css">

</head>
<body>

<a href="about.html">
	<img src="Red White Simple Volunteer Community Logo.png" alt="G03 Logo" width="200" />
</a>

<h1>Volunteer Registration</h1>

<form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">

	<fieldset>
	<legend>Application Details</legend>
 
		<label for="jobRef">Job Reference Number</label>
		<br />
		<input type="text" name="jobRef" id="jobRef" maxlength="6" required="required"
			pattern="[A-Za-z0-9]{6}" title="Enter exactly 6 alphanumeric characters" />
	</fieldset>

	<br />


	<fieldset>

	<legend>Personal Details</legend>

		<label for="givenName">Given Name</label>
		<br />

			<input type="text" name="givenName" id="givenName" maxlength="20" required="required"
				pattern="[A-Za-z]+" title="Alphabetical characters only" />

		<br />
		<br />


		<label for="familyName">Family Name</label>

		<br />

			<input type="text" name="familyName" id="familyName" maxlength="15" required="required"
				pattern="[A-Za-z]+" title="Alphabetical characters only" />


		<br />		
		<br />

		<label for="dateOfBirth">Date of Birth</label>
		<br />
		
		<input type="text" name="dob" id="dob" required="required"
			placeholder="dd/mm/yyyy"
			pattern="^(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/\d{4}$"
			title="Enter date as dd/mm/yyyy" />
 
		<br />
		<br />
		
		<fieldset>
		<label>Gender</label>
		<br />
			<input type="radio" id="genderMale" name="gender" value="Male" required="required" />
			<label for="genderMale">Male</label>
 
			<input type="radio" id="genderFemale" name="gender" value="Female" />
			<label for="genderFemale">Female</label>
 
			<input type="radio" id="genderOther" name="gender" value="Other" />
			<label for="genderOther">Other</label>
 
			<input type="radio" id="genderPreferNot" name="gender" value="Prefer not to say" />
			<label for="genderPreferNot">Prefer not to say</label>
		</fieldset>
	</fieldset>
 
 




<br />



    <fieldset>
        <legend>Contact Details</legend>

        <br />

        <label for="phonenumber">Phone Number</label> 
		<br />
		<input type="text" name="phonenumber" id="phonenumber" required="required"
			pattern="\d{7,10}" title="Enter between 7 and 10 digits" /> 

        <br />
        <br />

        <label for="email">Email</label>
		<br />
        <input type="email" name="email" id="email" required="required"
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Enter a valid email address" />
    </fieldset>


	<br />

	<fieldset>
		<legend>Skills</legend>
			<input type="checkbox" id="program1" name="program[]" value="Program1" />
			<label for="program1">Event Setup</label>

			<input type="checkbox" id="program2" name="program[]" value="Program2" />
			<label for="program2">     Community Events</label>

			<input type="checkbox" id="program3" name="program[]" value="Program3" />
			<label for="program3">Fundraising</label>

			<br />
			<br />

			<input type="checkbox" id="program4" name="program[]" value="Program4" />
			<label for="program4">Registration Help</label>

			<input type="checkbox" id="program5" name="program[]" value="Program5" />
			<label for="program5">Promotion</label>

			<input type="checkbox" id="program6" name="program[]" value="Program6" />
			<label for="program6">Assistance</label>		
	</fieldset>			
	
	<br />

	<fieldset>
		<legend>Other Skills</legend>
			<label for="otherSkills"></label>
			<textarea id="otherSkills" name="otherSkills" rows="4" cols="50"
				placeholder="List any other relevant skills here..."></textarea>
	</fieldset>

	<br />

	<fieldset>

	<legend>Address</legend>
 
		<label for="streetAddress">Street Address</label>
		<br />
		<input type="text" name="streetAddress" id="streetAddress" maxlength="40" required="required"
			title="Maximum 40 characters" />
 
		<br />
		<br />
 
		<label for="suburb">Suburb/Town</label>
		<br />
		<input type="text" name="suburb" id="suburb" maxlength="40" required="required"
			title="Maximum 40 characters" />
 
		<br />
		<br />
 
		<label for="state">State</label>
		<br />
		<select name="state" id="state" required="required">
			<option value="">Please Select</option>
			<option value="VIC">VIC</option>
			<option value="NSW">NSW</option>
			<option value="QLD">QLD</option>
			<option value="NT">NT</option>
			<option value="WA">WA</option>
			<option value="SA">SA</option>
			<option value="TAS">TAS</option>
			<option value="ACT">ACT</option>
		</select>
 
		<br />
		<br />
 
		<label for="postcode">Postcode</label>
		<br />
		<input type="text" name="postcode" id="postcode" maxlength="4" required="required"
			pattern="\d{4}" title="Enter exactly 4 digits" />
	</fieldset>
 
	<br />



	<input type="submit" value="Submit Application" />
	<input type="reset" value="Reset form" />

</form>

</body>
</html>
